[project]
name = "jevpip"
version = "0.1.0"
description = "GMOのFX・BTC市場データを使うローカル市場研究・paper tradingアプリ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "typesafe-sdk>=0.7,<0.8",
  "uvicorn>=0.35,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
jevpip = "jevpip.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevpip"]

[tool.hatch.build]
include = [
  "src/jevpip/profiles.toml",
  "src/jevpip/signals.toml",
  "src/jevpip/web/index.html",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
