[project]
name = "jevpip"
version = "0.1.0"
description = "USD/JPY research lab combining GMO Coin FX market data with TypeSafe AI Jev"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "typesafe-sdk>=0.7,<0.8",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
jevpip = "jevpip.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevpip"]

[tool.hatch.build]
include = ["src/jevpip/profiles.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
